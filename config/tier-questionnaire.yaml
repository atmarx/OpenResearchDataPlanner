# config/tier-questionnaire.yaml
# Decision tree questions to help users determine their data tier

# Introduction shown before questions
intro:
  title: "What type of data will you be working with?"
  description: |
    Answer a few questions to help us recommend the right security level
    for your research data. If you're unsure, err on the side of caution -
    you can always adjust later with our team.
  audience_note:
    title: "Who needs this questionnaire?"
    description: |
      **This applies to you if your research involves:**
      - Human subjects (surveys, interviews, health records, genetic data)
      - Biological samples (human, animal, or plant-derived)
      - Government-controlled or export-restricted data (CUI, ITAR, EAR)
      - Industry partnerships with data use agreements
      - Student records (FERPA-protected)

      **You can likely skip this if:**
      - You work purely with simulations, models, or computational data
      - Your data is already publicly available (published datasets, open source)
      - You study physical phenomena without biological or human components
      - Your research generates no sensitive intellectual property

      *Most engineering, physics, mathematics, and computer science research
      without external data agreements falls into our standard tier (L1).*
  skip_option:
    enabled: true
    label: "I already know my data tier"
    link: "/tier-select"
  quick_select:
    enabled: true
    label: "My data is not sensitive - use standard tier"
    tier: "low"

# Questions in order
questions:
  - id: human_subjects
    question: "Does your research involve human subjects?"
    help_text: "This includes surveys, interviews, medical records, genetic data, or any data collected from people."
    icon: "users"
    options:
      - label: "No"
        value: false
        next: biological_samples
      - label: "Yes"
        value: true
        next: health_data

  - id: biological_samples
    question: "Does your research involve biological samples or genetic/genomic data?"
    help_text: "DNA, RNA, tissue samples, cell cultures, or other biological materials - from any organism."
    icon: "dna"
    options:
      - label: "No"
        value: false
        next: government_data
      - label: "Yes"
        value: true
        next: organism_source

  - id: organism_source
    question: "What is the source of your biological samples or genetic data?"
    help_text: "Select the primary organism type. If working with multiple types, select the most sensitive."
    icon: "microscope"
    learn_more:
      title: "Why does organism source matter?"
      content: |
        Different organisms have different data protection requirements:

        **Human-derived materials** - Even without an IRB protocol, human DNA/tissue
        can potentially re-identify individuals. Requires careful handling.

        **Model organisms** (mice, rats, zebrafish, fruit flies, C. elegans, yeast) -
        Generally low sensitivity. Standard research data practices apply.

        **Wildlife and field samples** - May have location sensitivity (endangered
        species, poaching concerns) or permit requirements.

        **Agricultural/livestock** - May have proprietary breeding data or
        biosecurity considerations.
    options:
      - label: "Human-derived (tissue, cell lines, DNA/RNA)"
        value: "human"
        next: human_samples_detail
      - label: "Model organisms (mouse, rat, zebrafish, fly, worm, yeast)"
        value: "model_organism"
        sets_tier: low
        next: government_data
      - label: "Wildlife, field samples, or endangered species"
        value: "wildlife"
        next: wildlife_sensitivity
      - label: "Agricultural, livestock, or plants"
        value: "agricultural"
        next: agricultural_sensitivity

  - id: human_samples_detail
    question: "What type of human-derived samples are you working with?"
    help_text: "This helps determine if re-identification risk applies."
    icon: "user-scan"
    learn_more:
      title: "Re-identification risk in genomics"
      content: |
        Human genomic data presents unique re-identification challenges:

        **High risk** - Whole genome/exome sequences, large SNP panels, or any
        genetic data that could uniquely identify an individual or their relatives.

        **Moderate risk** - Targeted sequencing, specific gene panels, or data
        linked to demographic information.

        **Lower risk** - Immortalized cell lines (HeLa, HEK293), ancient DNA,
        or fully de-identified samples from commercial biobanks with proper
        consent documentation.

        When in doubt, treat as identifiable - it's easier to reclassify down
        than to contain a breach.
      link:
        label: "Check your data's identification status →"
        action: "open_calculator"
        calculator: "data-identification"
    options:
      - label: "Research participant samples (with consent/IRB)"
        value: "participant_samples"
        sets_tier: high
        sets_flags:
          - human_genomic
        next: government_data
      - label: "Biobank samples (commercial or repository)"
        value: "biobank"
        next: biobank_consent
      - label: "Immortalized cell lines (HeLa, HEK293, etc.)"
        value: "cell_lines"
        sets_tier: low
        next: government_data
      - label: "Ancient DNA or archaeological samples"
        value: "ancient_dna"
        sets_tier: low
        next: government_data

  - id: biobank_consent
    question: "What consent and de-identification applies to your biobank samples?"
    help_text: "Check the biobank's data use agreement or material transfer agreement."
    icon: "file-check"
    learn_more:
      title: "Coded vs. De-identified Biobank Samples"
      content: |
        **Coded samples** — The biobank can link sample IDs back to donors.
        Even if YOU don't have the key, the data is still re-identifiable
        and requires appropriate protections.

        **De-identified samples** — No linking key exists anywhere. The
        biobank has permanently destroyed or never created the link.

        Check your MTA or DUA for terms like "coded," "linked," or
        "identifiable" vs. "de-identified" or "anonymized."
      link:
        label: "Learn more about data identification →"
        action: "open_calculator"
        calculator: "data-identification"
    options:
      - label: "Fully de-identified with broad consent"
        value: "deidentified_broad"
        sets_tier: low
        next: government_data
      - label: "Coded samples (key held by biobank)"
        value: "coded"
        sets_tier: medium
        next: government_data
      - label: "Identifiable or consent restrictions apply"
        value: "identifiable"
        sets_tier: high
        sets_flags:
          - human_genomic
        next: government_data
      - label: "Not sure - need to check MTA/DUA"
        value: "unsure"
        sets_tier: high
        sets_flags:
          - human_genomic
          - needs_review
        next: government_data

  - id: wildlife_sensitivity
    question: "Does your wildlife data have location or conservation sensitivity?"
    help_text: "Endangered species locations, nesting sites, or other data that could enable poaching or harassment."
    icon: "bird"
    learn_more:
      title: "Location sensitivity in wildlife research"
      content: |
        Wildlife location data may need protection if it could:

        - Enable poaching of endangered species
        - Lead to disturbance of nesting sites
        - Compromise ongoing conservation efforts
        - Violate collection permit conditions

        Some journals and funders require location data to be obscured or
        embargoed for sensitive species.
    options:
      - label: "No - common species, no location concerns"
        value: "not_sensitive"
        sets_tier: low
        next: government_data
      - label: "Yes - endangered species or sensitive locations"
        value: "sensitive"
        sets_tier: medium
        sets_flags:
          - location_sensitive
        next: government_data
      - label: "Not sure"
        value: "unsure"
        sets_tier: medium
        next: government_data

  - id: agricultural_sensitivity
    question: "Does your agricultural/plant data involve proprietary or biosecurity concerns?"
    help_text: "Breeding programs, patented varieties, or Select Agent pathogens."
    icon: "wheat"
    options:
      - label: "No - standard research crops/livestock"
        value: "not_sensitive"
        sets_tier: low
        next: government_data
      - label: "Yes - proprietary breeding or commercial partnership"
        value: "proprietary"
        sets_tier: medium
        sets_flags:
          - proprietary
        next: government_data
      - label: "Yes - USDA Select Agent or biosecurity concern"
        value: "select_agent"
        sets_tier: restricted
        sets_flags:
          - select_agent
          - biosecurity
        next: complete

  - id: health_data
    question: "Does your data include health or medical information?"
    help_text: "Medical records, diagnoses, treatments, genetic information linked to individuals, mental health data, substance abuse records."
    icon: "heart-pulse"
    options:
      - label: "No"
        value: false
        next: student_data
      - label: "Yes"
        value: true
        sets_flags:
          - hipaa
          - phi
        next: identifiable

  - id: identifiable
    question: "Is the health data identifiable or de-identified?"
    help_text: "De-identified means all 18 HIPAA identifiers have been removed AND no linking key exists."
    icon: "user-check"
    learn_more:
      title: "Identified vs. Encoded vs. De-identified"
      content: |
        **Common confusion:** Replacing names with codes is NOT de-identification
        if you keep a linking key (even in a separate file).

        - **Identified** — Contains names, SSNs, etc. directly
        - **Encoded** — Codes instead of names, but a key exists somewhere
        - **De-identified** — No identifiers AND no way to link back

        As long as a linking key exists anywhere (Excel file, database, paper
        list, collaborator's copy), the data can be re-identified.
      link:
        label: "Help me figure out my data's status →"
        action: "open_calculator"
        calculator: "data-identification"
    options:
      - label: "Fully de-identified (Safe Harbor, no linking key)"
        value: "deidentified"
        sets_tier: medium
        clears_flags:
          - hipaa
          - phi
        next: government_data
      - label: "Encoded (codes with a linking key somewhere)"
        value: "encoded"
        sets_tier: high
        next: government_data
      - label: "Limited dataset (some identifiers remain)"
        value: "limited"
        sets_tier: high
        next: government_data
      - label: "Identifiable (names, SSNs, etc. in the data)"
        value: "identifiable"
        sets_tier: high
        next: government_data

  - id: student_data
    question: "Does your data include student education records?"
    help_text: "Grades, enrollment, coursework, or other data from student information systems."
    icon: "graduation-cap"
    options:
      - label: "No"
        value: false
        next: government_data
      - label: "Yes"
        value: true
        next: student_data_content

  - id: student_data_content
    question: "What kind of education records — and how are they used?"
    help_text: "FERPA covers all of these; the risk tier follows the content and use, the way peer universities classify student data."
    icon: "graduation-cap"
    learn_more:
      title: "How student records are classified"
      content: |
        All of these are FERPA-protected and access-controlled. The tier reflects
        how sensitive the content is and how it's used:

        - **Directory information** (name, enrollment status, dates of attendance)
          is disclosable without consent → **Low.**
        - **Routine coursework / instruction** — using LLMs and tools in a course,
          assignments, submissions, and course grades. School-official use under
          legitimate educational interest → **Medium.**
        - **Sensitive records** — transcripts, disciplinary records, financial-aid
          data (also GLBA-regulated), Social Security numbers, or health data —
          carry heightened protection regardless of use → **High.**
        - **Research** — analyzing or linking identifiable education records to
          study outcomes (IRB + the FERPA "studies" exception) → **High.**

        Peer R1 universities escalate by content, not by use: sensitive records
        stay High even in routine handling.

        **De-identified education records** fall *outside* FERPA entirely
        (34 CFR 99.31(b)) — the same carve-out as HIPAA de-identification. But
        "de-identified" means no direct *or* indirect identifiers and no linking key,
        with reasonable certainty a student can't be re-identified — and it is the
        **Registrar / Institutional Research** who confirms it, never the researcher.
    options:
      - label: "Directory information only (name, enrollment status, dates of attendance)"
        value: "directory"
        sets_tier: low
        next: government_data
      - label: "De-identified — no direct or indirect identifiers, no linking key"
        value: "deidentified"
        sets_tier: low
        sets_flags:
          - needs_review
        next: government_data
      - label: "Routine coursework / instructional records (incl. classroom LLM use)"
        value: "instructional"
        sets_tier: medium
        sets_flags:
          - ferpa_instructional
        next: government_data
      - label: "Sensitive records — transcripts, disciplinary, financial aid, SSN, or health"
        value: "sensitive"
        sets_tier: high
        sets_flags:
          - ferpa
        next: government_data
      - label: "Research use — analyzing or linking identifiable education records"
        value: "research"
        sets_tier: high
        sets_flags:
          - ferpa_research
        next: government_data

  - id: government_data
    question: "Is this research funded by or for a government agency?"
    help_text: "Federal contracts and grants may carry specific data handling requirements depending on the agency."
    icon: "landmark"
    learn_more:
      title: "Which agency funded your work?"
      content: |
        **Standard science agencies** (NSF, NIH, USDA, EPA, NASA science programs)
        generally follow open-data policies with no special data controls.

        **Humanities and arts agencies** (NEH, NEA, IMLS) also follow standard
        open-data policies. NEH typically requires a data management plan but
        imposes no special security requirements.

        **Defense and security agencies** (DoD, DHS, certain DOE programs) may
        impose Controlled Unclassified Information (CUI) requirements or other
        restrictions. Check your contract.

        **DOE/DOE National Labs** — depends on whether work is funded through
        the Office of Science (standard) or a classified/national-security
        program (restricted). Check your award documentation.

        If you're not sure, check your Notice of Award or contract for terms
        like "CUI," "DFARS," "NIST 800-171," or "sensitive but unclassified."
    options:
      - label: "No"
        value: false
        next: export_control
      - label: "Yes - NSF, NIH, NEH, NEA, or other standard federal grant"
        value: "standard_federal"
        next: export_control
      - label: "Yes - DoD/defense-related"
        value: "dod"
        sets_flags:
          - cui_possible
        next: cui_check
      - label: "Yes - DOE, DHS, NASA, or other agency with possible CUI"
        value: "other_federal_cui"
        sets_flags:
          - cui_possible
        next: cui_check

  - id: cui_check
    question: "Does your contract specify CUI (Controlled Unclassified Information)?"
    help_text: "Check your contract for terms like 'CUI', 'DFARS 252.204-7012', or 'NIST 800-171'."
    icon: "file-lock"
    learn_more:
      title: "What is CUI?"
      content: |
        Controlled Unclassified Information (CUI) is government-created or
        government-owned information that requires safeguarding. Look for:

        - "CUI" marking on documents
        - Contract clause DFARS 252.204-7012
        - References to NIST SP 800-171
        - Terms like "Controlled Technical Information"

        If unsure, contact your contracting officer or our export control office.
    options:
      - label: "No / Not sure"
        value: false
        next: export_control
      - label: "Yes"
        value: true
        sets_tier: restricted
        sets_flags:
          - cui
          - nist_800_171
        next: complete

  - id: export_control
    question: "Does your research involve export-controlled technology?"
    help_text: "ITAR (defense articles), EAR (dual-use technology), or technology that cannot be shared with non-US persons."
    icon: "globe-lock"
    learn_more:
      title: "Export Control Basics"
      content: |
        Export control laws restrict sharing certain technology with non-US
        persons. This applies even to verbal discussions, not just physical
        exports.

        **ITAR** - International Traffic in Arms Regulations
        - Covers defense articles and technical data
        - Very restrictive, US persons only

        **EAR** - Export Administration Regulations
        - Covers dual-use commercial items
        - Less restrictive but still requires compliance

        **Before you assume the strictest tier:** most university research on a
        controlled *topic* is still publishable fundamental research, and the
        **Fundamental Research Exclusion** removes those results from control. The
        next few questions check whether it applies to you — answer honestly and
        we'll route you to the Export Control Officer, not straight to the enclave.

        The goal here isn't a verdict — it's a **shared starting point.** Your
        answers give you and the Export Control Officer the same understanding of
        the situation *before* the consultation, so nobody walks in blind and the
        conversation begins from common ground.

        Contact our Export Control office if you're unsure.
    options:
      - label: "No / Not sure"
        value: false
        next: proprietary_check
      - label: "Yes - ITAR (defense articles, military technology)"
        value: "itar"
        sets_flags:
          - itar
        next: fre_gate
      - label: "Yes - EAR (dual-use commercial technology)"
        value: "ear"
        sets_flags:
          - ear
        next: fre_gate
      - label: "Yes - both ITAR and EAR apply"
        value: "itar_ear"
        sets_flags:
          - itar
          - ear
        next: fre_gate

  - id: fre_gate
    question: "Is this fundamental research — work you intend to publish openly, with no restrictions on what you can share?"
    help_text: "The Fundamental Research Exclusion (FRE) removes results you're free to publish from export control. It protects your RESULTS, not controlled INPUTS a sponsor hands you — and it's destroyed the moment a publication or personnel restriction attaches."
    icon: "book-open-check"
    learn_more:
      title: "What the Fundamental Research Exclusion actually covers"
      content: |
        Export control (ITAR/EAR) restricts sharing controlled technology with
        non-US persons. But there is a large, often-missed carve-out: the
        **Fundamental Research Exclusion (FRE)** — EAR 15 CFR 734.8; ITAR 22 CFR
        120.34(a)(8).

        **What it covers:** basic and applied research in science and engineering
        where the resulting information is *ordinarily published and shared broadly.*
        If your work is genuinely fundamental research, the RESULTS you publish are
        not export-controlled — even on a controlled topic.

        **The three ways to lose it:**
        - **Publication restrictions** — any clause letting a sponsor approve, delay
          (beyond a brief patent/proprietary courtesy review), or block publication.
        - **Personnel restrictions** — any limit on who may participate (e.g. foreign
          nationals excluded), or a side agreement imposing controls.
        - **Controlled inputs & physical exports** — controlled technical data or
          hardware provided as an INPUT stays controlled, and physically shipping or
          carrying a controlled item abroad is never fundamental research.

        **This is the Export Control Officer's determination to confirm — you cannot
        self-certify it.** Answering honestly here routes you to that conversation
        instead of the strictest default.
    options:
      - label: "Yes — fundamental research I intend to publish openly"
        value: true
        next: fre_restrictions
      - label: "No, or not sure — there may be limits on publishing or sharing"
        value: false
        sets_tier: restricted
        sets_flags:
          - needs_review
        next: complete

  - id: fre_restrictions
    question: "Does any award term or agreement restrict publication or who can participate?"
    help_text: "Publication-approval clauses, pre-publication review beyond a brief patent courtesy, exclusion of foreign nationals, or any side agreement imposing controls. Any ONE of these destroys the exclusion."
    icon: "file-x"
    learn_more:
      title: "The clauses that destroy the exclusion"
      content: |
        Any ONE of these means the Fundamental Research Exclusion does not apply and
        the work is export-controlled:

        - **Publication approval / restriction** — the sponsor may review to block or
          delay publication. (A short courtesy review to remove the sponsor's *own*
          proprietary data or to file a patent does NOT destroy the exclusion;
          approval rights over YOUR results do.)
        - **Personnel / access restriction** — the agreement limits participation,
          e.g. "no foreign nationals," or requires citizenship-based access controls.
        - **Side agreement** — any separate understanding imposing controls the main
          award doesn't state (this is usually a policy problem too — flag it).

        If none of these apply, your published results are likely fundamental research.
    options:
      - label: "No — I'm free to publish, and anyone may participate"
        value: false
        next: fre_inputs
      - label: "Yes — publication or participation is restricted"
        value: true
        sets_tier: restricted
        sets_flags:
          - needs_review
        next: complete

  - id: fre_inputs
    question: "Apart from your publishable results, will you receive controlled inputs or export anything physically?"
    help_text: "Controlled technical data or hardware a sponsor provides as an INPUT stays controlled even when your results are publishable. Shipping or hand-carrying a controlled item abroad is never covered."
    icon: "package-x"
    learn_more:
      title: "Results are free; inputs and physical exports are not"
      content: |
        The exclusion covers the research RESULTS you publish. It does not decontrol:

        - **Controlled inputs** — technical data, drawings, software, or hardware a
          sponsor hands you under an export-controlled designation. Those stay
          controlled and belong in an approved environment, even while your published
          findings do not.
        - **Physical exports** — actually shipping or carrying a controlled item or
          medium across a border is an export in its own right, outside the exclusion.

        If neither applies, your work is publishable fundamental research and the
        Export Control Officer can confirm the exclusion.
    options:
      - label: "No — my controlled work is the research results I'll publish"
        value: false
        sets_tier: high
        sets_flags:
          - fre
          - needs_review
        next: proprietary_check
      - label: "Yes — I'll handle controlled inputs or export items physically"
        value: true
        sets_tier: restricted
        sets_flags:
          - fre
          - needs_review
        next: complete

  - id: proprietary_check
    question: "Does your research involve proprietary or confidential data?"
    help_text: "Industry partnerships with NDAs, proprietary algorithms, trade secrets, or data you've agreed to keep confidential."
    icon: "lock"
    options:
      - label: "No - publicly shareable"
        value: false
        next: complete
      - label: "Yes - pre-publication or NDA-protected"
        value: true
        sets_tier: medium
        next: complete

  - id: complete
    type: "summary"

# Summary page configuration
summary:
  title: "Your Recommended Data Tier"
  show_flags: true
  show_reasoning: true

  # Call-to-action based on tier (keys match tier slugs from tiers.yaml)
  cta:
    low:
      title: "You're ready to go!"
      message: "Self-service access available for low-tier data."
      action: "Continue to Service Selection"
    medium:
      title: "You're ready to go!"
      message: "Self-service access available for medium-tier data."
      action: "Continue to Service Selection"
    high:
      title: "Consultation recommended"
      message: "High-tier data requires verification. We'll walk you through it."
      action: "Continue to Service Selection"
      secondary_action: "Schedule Consultation First"
    restricted:
      title: "Consultation required"
      message: "Restricted data requires export control review before proceeding."
      action: "Schedule Consultation"
      secondary_action: "Continue Planning (Preliminary)"

# Discipline-specific examples to help users understand
# Keys under 'examples' must match tier slugs from tiers.yaml (low, medium, high, restricted)
examples_by_discipline:
  biomedical:
    name: "Biomedical / Life Sciences"
    icon: "microscope"
    examples:
      low:
        - "Published protein structures from PDB"
        - "Public genomics datasets from NCBI (1000 Genomes, GTEx)"
        - "Immortalized cell line data (HeLa, HEK293)"
        - "Mouse/rat model organism sequencing"
        - "Zebrafish, C. elegans, Drosophila data"
        - "Yeast genomics and proteomics"
        - "Ancient DNA or archaeological samples"
        - "Fully de-identified biobank samples with broad consent"
      medium:
        - "Your lab's unpublished experimental results"
        - "Pre-publication manuscripts and figures"
        - "Proprietary analysis pipelines"
        - "Coded biobank samples (key held by repository)"
        - "Wildlife data with location sensitivity"
        - "Endangered species genetic data"
      high:
        - "Patient samples with clinical data"
        - "Human genetic data linked to individuals"
        - "Human whole genome/exome sequencing"
        - "Research participant samples (even with consent)"
        - "Biobank samples with consent restrictions"
        - "Clinical trial data"
        - "dbGaP controlled-access data"

  genomics:
    name: "Genomics & Bioinformatics"
    icon: "dna"
    examples:
      low:
        - "Reference genomes (GRCh38, mm10, etc.)"
        - "Model organism sequencing (mouse, fly, worm, yeast)"
        - "Public repositories (SRA, ENA, DDBJ)"
        - "Cell line genomics (CCLE, DepMap)"
        - "Microbial/viral genomes"
        - "Plant genomics (non-proprietary)"
      medium:
        - "Unpublished sequencing data (non-human)"
        - "Proprietary breeding program data"
        - "Coded human samples from repositories"
        - "Pre-publication analysis results"
      high:
        - "Human WGS/WES with individual identifiers"
        - "Patient tumor sequencing"
        - "Genetic data linked to phenotype/clinical"
        - "dbGaP or controlled-access datasets"
        - "Research participant samples"

  engineering:
    name: "Engineering"
    icon: "cog"
    examples:
      low:
        - "Published simulation results"
        - "Open-source CAD models"
        - "Public benchmark datasets"
      medium:
        - "Proprietary designs before patent filing"
        - "Industry collaboration data under NDA"
        - "Unpublished experimental results"
      high:
        - "Human-subjects data from wearable, biomechanics, or human-factors studies (IRB)"
        - "Patient data from biomedical-device or rehabilitation trials (PHI)"
        - "Identifiable telematics or GPS trajectory data from human participants"
      restricted:
        - "Defense contractor research (ITAR)"
        - "CUI-marked government data"
        - "Export-controlled technology"

  social_science:
    name: "Social Sciences"
    icon: "users"
    examples:
      low:
        - "Census data and public surveys"
        - "Published interview transcripts"
        - "Aggregated demographic data"
      medium:
        - "Ongoing survey responses (anonymized)"
        - "Interview recordings (consent obtained)"
        - "Unpublished qualitative data"
      high:
        - "Student educational records (FERPA)"
        - "Identifiable interview data"
        - "Sensitive survey responses"

  humanities:
    name: "Humanities & Arts"
    icon: "book"
    examples:
      low:
        - "Public domain texts and images"
        - "Published research materials"
        - "Open-access archives"
      medium:
        - "Unpublished manuscripts"
        - "Licensed digital collections"
        - "Pre-publication analyses"
      high:
        - "Oral histories with living subjects under consent or embargo restrictions"
        - "Ethnographic or fieldwork data identifying vulnerable communities (IRB)"
        - "Archival collections containing personal records under privacy restrictions"

  physical_science:
    name: "Physical Sciences"
    icon: "atom"
    examples:
      low:
        - "Published simulation data"
        - "Public astronomy observations"
        - "Open datasets from collaborations"
      medium:
        - "Unpublished experimental results"
        - "Proprietary instrument data"
        - "Pre-publication findings"
      high:
        - "Medical physics: patient dose or treatment-planning data (PHI)"
        - "Personnel dosimetry and radiation-exposure health records"
        - "Precise locations of protected sites (archaeological, sacred, endangered habitat)"

# Allow users to override the recommendation
override:
  enabled: true
  confirmation_required: true
  confirmation_text: |
    You're selecting a different tier than our recommendation.
    Please confirm you understand the implications:

    - **Selecting a lower tier** may mean your data isn't adequately protected
    - **Selecting a higher tier** will require additional approval steps

    If you're unsure, please contact Research Computing for guidance.

# Quick-select option for experienced users
quick_select:
  enabled: true
  title: "I know my data tier"
  description: "Skip the questionnaire if you already know your classification"
  show_examples: true
