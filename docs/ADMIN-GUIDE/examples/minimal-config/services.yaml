# =============================================================================
# MINIMAL CONFIG: services.yaml
# =============================================================================
# Three essential services: HPC compute, standard storage, compliant storage.
# Demonstrates key concepts: cost models, subsidies, estimation UI.
#
# Tier availability is set in mappings.yaml, not on the service itself.
# Every service used in the wizard needs at least one mappings entry.
# =============================================================================

services:
  # ===========================================================================
  # SERVICE 1: HPC Compute
  # ===========================================================================
  - slug: hpc-compute
    name: "HPC Compute"
    category: compute                       # Must match categories.yaml

    description: "CPU compute time on the campus cluster"

    # Pricing model
    cost_model:
      type: unit                            # Per-unit pricing
      unit: "SU"                            # Service Unit
      unit_label: "SU"                      # Display label in the UI
      price: 0.05                           # $0.05 per SU

    # Estimation UI
    estimation:
      prompt: "How many Service Units do you need?"
      default_value: 10000
      presets:                              # Quick-select options
        - label: "Small project"
          value: 5000
        - label: "Medium project"
          value: 50000
        - label: "Large project"
          value: 200000

    # Documentation link
    documentation_url: "https://hpc.contoso.edu/docs"

  # ===========================================================================
  # SERVICE 2: Research Storage (Standard)
  # ===========================================================================
  - slug: research-storage
    name: "Research Storage"
    category: storage

    description: "Shared storage for active research data"

    # Tiered pricing model
    cost_model:
      type: tiered                          # Volume-based pricing (marginal bands)
      unit: "TB"
      unit_label: "TB"
      tiers:                                # each up_to is a cumulative ceiling
        # The free first TB comes from the subsidy below (free units come off
        # the quantity BEFORE banding) — don't also add a $0 band, or users
        # get the free allowance twice.
        - up_to: 10
          price: 10                         # $10/TB/month for billable TB up to 10
        - up_to: null                       # null = unbounded top band
          price: 8                          # $8/TB/month above 10 TB

    # Automatic subsidy
    subsidies:
      - slug: free-tier
        name: "Free Tier"
        description: "First 1 TB included at no cost"
        discount_type: free_units
        discount_value: 1
        auto_apply: true                    # Applied automatically

    estimation:
      prompt: "How much storage do you need?"
      default_value: 5

    documentation_url: "https://storage.contoso.edu"

  # ===========================================================================
  # SERVICE 3: Secure Storage (Compliant)
  # ===========================================================================
  - slug: secure-storage
    name: "Secure Storage"
    category: storage

    description: "Encrypted storage for regulated data (HIPAA, FERPA)"

    cost_model:
      type: unit
      unit: "TB"
      unit_label: "TB"
      price: 30                             # Higher price for compliance

    estimation:
      prompt: "How much secure storage do you need?"
      default_value: 1

    documentation_url: "https://storage.contoso.edu/secure"
