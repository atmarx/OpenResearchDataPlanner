when:
  - event: push
    branch: main
  - event: tag

labels:
  platform: build

steps:
  # Runs first, so a red suite stops the images from being pushed and deployed.
  # build:config (not validate:config) because tests/validateConfig.test.js reads
  # the built public/config.json, which is gitignored. No secrets, no docker.sock.
  - name: test
    image: node:22-alpine
    commands:
      - npm ci --no-audit --no-fund
      - npm run build:config
      - npm test

  - name: build-and-push
    image: docker:cli
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - echo "$GITEA_TOKEN" | docker login -u ${CI_REPO_OWNER} --password-stdin git.dev.xram.net
      - docker build --pull -t git.dev.xram.net/${CI_REPO}:${CI_COMMIT_SHA:0:7} -t git.dev.xram.net/${CI_REPO}:latest .
      - docker push git.dev.xram.net/${CI_REPO}:${CI_COMMIT_SHA:0:7}
      - docker push git.dev.xram.net/${CI_REPO}:latest
      - docker build --pull -f services/feedback-api/Dockerfile -t git.dev.xram.net/${CI_REPO}-feedback:${CI_COMMIT_SHA:0:7} -t git.dev.xram.net/${CI_REPO}-feedback:latest services/feedback-api
      - docker push git.dev.xram.net/${CI_REPO}-feedback:${CI_COMMIT_SHA:0:7}
      - docker push git.dev.xram.net/${CI_REPO}-feedback:latest
      - docker image prune -f || true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
